auth = "plain[passwd=/state/ocpasswd]"
tcp-port = 443
udp-port = 0
run-as-user = ocserv
run-as-group = ocserv
socket-file = /run/ocserv-socket
pid-file = /run/ocserv.pid
server-cert = /state/server-cert.pem
server-key = /state/server-key.pem
max-clients = 4
max-same-clients = 2
keepalive = 20
dpd = 30
mobile-dpd = 30
try-mtu-discovery = false
cisco-client-compat = true
isolate-workers = false
device = vpns
ipv4-network = 10.91.0.0
ipv4-netmask = 255.255.255.0
dns = 10.91.0.1
route = 10.91.0.0/255.255.255.0
default-domain = lab.sslray.test
