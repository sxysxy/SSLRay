[package]
name = "vpn-core"
version = "0.4.5"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[dependencies]
zeroize = "1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
ipnet = { version = "2", features = ["serde"] }
hex = "0.4"
rand = "0.9"
libc = "0.2"

[dev-dependencies]
toml = "0.9"
serde_json = "1"
