[package]
name = "vpn-openvpn"
version = "0.4.5"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[dependencies]
vpn-core = { path = "../vpn-core" }
vpn-tls = { path = "../vpn-tls" }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { version = "0.1", features = ["max_level_off"] }
ipnet = { version = "2", features = ["serde"] }
rand = "0.9"
hex = "0.4"
base64 = "0.23"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
x509-parser = "0.18"
md-5 = "0.10"
hmac = "0.12"
sha1 = "0.10"
aes = "0.8"
ctr = "0.9"
zeroize = "1"

[dev-dependencies]
rcgen = "0.14.10"
toml = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
