[package]
name = "sslray"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
# Build scripts execute on the host; this also supports cross-building Windows
# from macOS/Linux. build.rs invokes the resource compiler only for Windows.
embed-resource = "3.0"

[dependencies]
sslray-core = { path = "../sslray-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
base64 = "0.23"
libc.workspace = true
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
tray-icon = { version = "0.24.1", default-features = false, features = ["gtk"] }
directories = "6"
rpassword = "7"
clap = { version = "4", features = ["derive"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dependencies.ctrlc]
version = "3"

[dependencies.getrandom]
version = "0.3"
[dependencies.hex]
version = "0.4"
