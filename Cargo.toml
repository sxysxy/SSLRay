[workspace]
members = ["crates/sslray-core", "crates/sslray-app"]
exclude = ["third_party/omnitun/crates/vpn-core", "third_party/omnitun/crates/vpn-tls", "third_party/omnitun/crates/vpn-openvpn"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
openssl = "0.10"
libc = "0.2"
